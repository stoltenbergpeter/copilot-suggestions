<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conversation monitor</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://sdk-cdn.mypurecloud.com/javascript/latest/purecloud-platform-client-v2.min.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <div class="connection-bar">
        <div id="connection-status" class="connection-status waiting" aria-live="polite">
          <span class="status-dot"></span>
          <span id="connection-label">Connecting to Genesys Cloud</span>
        </div>
      </div>

      <section class="conversation-card" aria-label="Live customer conversation">
        <section id="intent-panel" class="intent-panel" aria-live="polite" hidden>
          <div class="intent-icon" aria-hidden="true">&#10022;</div>
          <div class="intent-copy">
            <p class="eyebrow">Intent detected</p>
            <h3 id="intent-name"></h3>
            <p id="intent-detail"></p>
          </div>
          <button id="intent-action" class="recommended-action" type="button">Create follow-up task</button>
        </section>

        <div id="transcript" class="transcript" aria-live="polite" aria-label="Conversation transcript"></div>

        <section class="notes-panel" aria-labelledby="notes-heading">
          <div class="notes-heading">
            <h3 id="notes-heading">Notes</h3>
            <span>Saved locally</span>
          </div>
          <div id="notes-editor" class="notes-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Conversation notes" data-placeholder="Add notes for this conversation..."></div>
        </section>

        <section id="summary-panel" class="summary-panel" aria-labelledby="summary-heading" hidden>
          <div class="summary-heading">
            <div>
              <p class="eyebrow">Conversation summary</p>
              <h3 id="summary-heading">Ready for review</h3>
            </div>
            <span class="summary-status">Generated</span>
          </div>
          <p id="summary-text" class="summary-text"></p>
          <div class="summary-feedback">
            <span>Was this summary helpful?</span>
            <div class="summary-actions">
              <button id="summary-like" class="thumb-button" type="button" aria-pressed="false" aria-label="Mark summary as helpful">&#128077; <span>Helpful</span></button>
              <button id="sync-summary" class="sync-button" type="button">Sync to activity</button>
            </div>
          </div>
        </section>

        <footer class="conversation-footer">
          <span id="message-count">0 messages</span>
        </footer>
      </section>
    </main>
  </body>
</html>
